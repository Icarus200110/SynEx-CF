# A fold is one outer held-out section; classifier selection is nested inside training.
seed: 42
data:
  dataset: her2st
  data_root: data
  manifest: null
  fold: 0
  train_samples: null
  val_samples: null
  test_samples: null
  patch_size: 224
  max_spots_per_sample: null
  batch_size: 1
  num_workers: 0
  auto_patch_size: false
  skip_undetermined: true
  undersample_majority: false
  validation_split: 0.1
model:
  type: spotvit_small
  img_size: 224
  token_patch_size: 16
training:
  epochs: 100
  spot_chunk_size: 128
  gradient_clip_norm: 1.0
optimizer:
  type: adam
  learning_rate: 0.0005
scheduler:
  type: step
  step_size: 30
  gamma: 0.1
device:
  use_cuda: true
  mixed_precision: true
inference:
  batch_size: 1
  spot_chunk_size: 128

